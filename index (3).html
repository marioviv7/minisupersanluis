<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minisúper San Luis · Valle Imperial</title>
<meta name="description" content="Minisúper San Luis en Valle Imperial, Zapopan. Abarrotes, frutas y verduras, cremería, guisos y bebidas frías. Haz tu pedido por WhatsApp.">
<meta name="theme-color" content="#dfe54a">
<meta property="og:title" content="Minisúper San Luis · Valle Imperial">
<meta property="og:description" content="Arma tu lista del mandado y mándala por WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: una columna tipo celular. Arriba el vinil lima de su vitrina con la foto de la fachada y el rótulo;
   en medio los botones; abajo un bloque azul marino con la lista del mandado. Los títulos son los globos guinda de sus ventanas. */
:root{
  --lima:#dfe54a;        /* vinil de la vitrina */
  --lima-osc:#c3ca2c;
  --marino:#1c2566;      /* letras del rótulo "Súper San Luis" */
  --marino-osc:#131a4c;
  --guinda:#7c1d3e;      /* globos "Abarrotes Frutas Verduras" */
  --papel:#f7f7ee;       /* blanco con un toque de lima */
  --blanco:#ffffff;
  --tinta:#161b40;
  --tinta-suave:#565b7c;
  --linea:#dcdccb;
  --wa:#128c4a;
  --rotulo:"Archivo Black","Arial Black",Impact,sans-serif;
  --texto:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:12px}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--texto);font-size:16px;line-height:1.45}
img{max-width:100%;display:block}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--guinda);outline-offset:3px}
.col{width:100%;max-width:480px;margin-inline:auto;padding-inline:18px}

/* aviso de borrador */
.borrador{background:var(--tinta);color:#fff;font-size:13px;padding:10px 0}
.borrador b{color:var(--lima)}

/* cabecera */
.vitrina{background:var(--lima);padding-block:18px 0;
  background-image:radial-gradient(circle at 12% 18%,rgba(255,255,255,.35) 0 38px,transparent 39px),radial-gradient(circle at 92% 62%,rgba(255,255,255,.28) 0 54px,transparent 55px)}
.foto{border-radius:18px;overflow:hidden;border:4px solid var(--blanco);box-shadow:0 10px 0 -4px var(--lima-osc);aspect-ratio:3/2;background:var(--lima-osc)}
.foto img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.rotulo{position:relative;background:var(--blanco);border-radius:6px;margin:-34px 14px 0;padding:14px 16px 13px;text-align:center;
  box-shadow:0 2px 0 var(--linea),0 14px 24px -14px rgba(22,27,64,.45)}
.rotulo small{display:block;font-weight:800;letter-spacing:.22em;font-size:12px;color:var(--guinda)}
.rotulo h1{margin:2px 0 0;font-family:var(--rotulo);font-weight:400;color:var(--marino);font-size:clamp(34px,11vw,46px);line-height:.95;letter-spacing:.01em;text-transform:uppercase}
.sub{display:flex;flex-wrap:wrap;gap:8px 10px;justify-content:center;align-items:center;padding-block:14px 20px;font-weight:600;font-size:14.5px;color:var(--marino-osc)}
.estado{display:inline-flex;align-items:center;gap:6px;background:var(--blanco);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:700}
.estado i{width:8px;height:8px;border-radius:50%;background:var(--wa)}
.estado.cerrado i{background:#b3261e}

/* secciones */
main{display:flex;flex-direction:column;gap:30px;padding-block:24px 34px}
.globo{display:inline-block;position:relative;background:var(--guinda);color:#fff;font-family:var(--rotulo);font-weight:400;text-transform:uppercase;
  font-size:17px;letter-spacing:.02em;line-height:1.1;padding:10px 16px;border-radius:14px;margin:0 0 16px;transform:rotate(-1.5deg);text-wrap:balance}
.globo::after{content:"";position:absolute;left:22px;bottom:-9px;border:10px solid transparent;border-top-color:var(--guinda);border-bottom:0;border-left-width:0}
.marino .globo{background:var(--lima);color:var(--marino-osc)}
.marino .globo::after{border-top-color:var(--lima)}

/* botones */
.links{display:flex;flex-direction:column;gap:10px}
.btn{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:12px;min-height:64px;padding:10px 14px;border-radius:14px;
  background:var(--blanco);border:2px solid var(--marino);color:var(--marino-osc);text-decoration:none;box-shadow:0 4px 0 var(--marino);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--marino)}
.btn .ic{width:42px;height:42px;border-radius:11px;background:var(--papel);display:grid;place-items:center}
.btn svg{width:23px;height:23px;fill:var(--marino)}
.btn b{display:block;font-size:16.5px;font-weight:800;line-height:1.2}
.btn span{display:block;font-size:13.5px;color:var(--tinta-suave);min-width:0}
.btn .fl{font-family:var(--rotulo);font-size:18px}
.btn.principal{background:var(--marino);color:#fff}
.btn.principal span{color:#cfd3f2}
.btn.principal .ic{background:var(--lima)}
.btn.principal svg{fill:var(--marino-osc)}
.btn.falta{border-style:dashed;box-shadow:none;opacity:.78;cursor:default}
.btn.falta:hover{transform:none}
.tag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--lima);color:var(--marino-osc);padding:3px 7px;border-radius:6px;white-space:nowrap}

/* lo que hay */
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.fotos figure{margin:0;border-radius:14px;overflow:hidden;position:relative;aspect-ratio:4/5;background:var(--linea)}
.fotos img{width:100%;height:100%;object-fit:cover}
.fotos figcaption{position:absolute;left:8px;bottom:8px;right:8px;background:var(--blanco);color:var(--marino-osc);font-weight:800;font-size:13px;line-height:1.2;padding:6px 9px;border-radius:8px}
.fotos figcaption em{display:block;font-style:normal;font-weight:500;color:var(--tinta-suave);font-size:12px}
.pasillos{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:7px}
.pasillos li{background:var(--blanco);border:1.5px solid var(--linea);border-radius:99px;padding:6px 12px;font-weight:600;font-size:14px}

/* lista del mandado */
.marino{background:var(--marino);color:#fff;padding-block:28px 30px}
.marino p{margin:0 0 14px;color:#d5d8f3;font-size:15px}
.rapidos{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chip{font:inherit;font-weight:700;font-size:14px;color:#fff;background:transparent;border:1.5px solid rgba(255,255,255,.45);border-radius:99px;padding:7px 12px;cursor:pointer}
.chip:hover{border-color:var(--lima)}
.chip[aria-pressed="true"]{background:var(--lima);border-color:var(--lima);color:var(--marino-osc)}
.agrega{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}
.agrega input{min-width:0;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:2px solid transparent;background:#fff;color:var(--tinta)}
.agrega input:focus{outline:none;border-color:var(--lima)}
.agrega button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:0 16px;background:var(--lima);color:var(--marino-osc);cursor:pointer}
.ticket{background:#fff;color:var(--tinta);border-radius:12px;padding:6px 14px;margin-bottom:12px}
.ticket ul{list-style:none;margin:0;padding:0}
.ticket li{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:9px 0;border-bottom:1.5px dashed var(--linea);font-weight:600}
.ticket li:last-child{border-bottom:0}
.ticket li>span{min-width:0;overflow-wrap:anywhere}
.cant{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.cant button{width:32px;height:32px;border-radius:9px;border:1.5px solid var(--linea);background:var(--papel);color:var(--marino);font:inherit;font-weight:800;font-size:17px;line-height:1;cursor:pointer}
.cant output{min-width:24px;text-align:center;font-weight:800}
.vacia{margin:0!important;padding:12px 0;color:var(--tinta-suave)!important;font-size:14.5px!important}
.enviar{width:100%;font:inherit;font-weight:800;font-size:17px;border:0;border-radius:14px;padding:16px;background:var(--lima);color:var(--marino-osc);cursor:pointer;
  display:flex;justify-content:center;align-items:center;gap:10px;box-shadow:0 4px 0 var(--lima-osc)}
.enviar:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lima-osc)}
.enviar:disabled{opacity:.5;cursor:not-allowed}
.enviar svg{width:22px;height:22px;fill:currentColor}
.previa{margin-top:12px;background:#e7f6e1;color:#16301d;border-radius:4px 14px 14px 14px;padding:12px 14px;font-size:14.5px;white-space:pre-wrap}
.previa b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;opacity:.7}

/* datos */
.datos{display:grid;gap:14px;margin:0}
.datos div{display:grid;grid-template-columns:92px 1fr;gap:10px}
.datos dt{font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--guinda);padding-top:3px}
.datos dd{margin:0;min-width:0;font-weight:500}
.horas{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-variant-numeric:tabular-nums}
.horas .hoy{font-weight:800;color:var(--marino)}
.pend{color:var(--tinta-suave);font-style:italic}

footer{padding-block:6px 30px;text-align:center;font-size:13px;color:var(--tinta-suave)}
footer a{font-weight:700;color:var(--marino);text-decoration:none}
@media (prefers-reduced-motion:reduce){.btn,.enviar{transition:none}}
</style>
</head>

  star: '<path d="m12 2.500 2.900 6 6.600.900-4.800 4.600 1.200 6.500L12 17.400l-5.900 3.100 1.200-6.500-4.800-4.600 6.600-.900L12 2.500Z"/>',
  pin: '<path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7Zm0 9.500A2.500 2.500 0 1 1 12 6.500a2.500 2.500 0 0 1 0 5Z"/>',
  tel: '<path d="M6.600 2.800 9 2l2.200 5-1.900 1.500a11 11 0 0 0 6.200 6.200L17 12.800l5 2.200-.800 2.400A4 4 0 0 1 17.200 20 15.200 15.200 0 0 1 4 6.800a4 4 0 0 1 2.600-4Z"/>',
  ig: '<path d="M7.500 2h9A5.500 5.500 0 0 1 22 7.500v9a5.500 5.500 0 0 1-5.500 5.500h-9A5.500 5.500 0 0 1 2 16.500v-9A5.500 5.500 0 0 1 7.500 2Zm0 2A3.500 3.500 0 0 0 4 7.500v9A3.500 3.500 0 0 0 7.500 20h9a3.500 3.500 0 0 0 3.500-3.500v-9A3.500 3.500 0 0 0 16.500 4h-9ZM12 7.500a4.500 4.500 0 1 1 0 9 4.500 4.500 0 0 1 0-9Zm0 2a2.500 2.500 0 1 0 0 5 2.500 2.500 0 0 0 0-5Zm5-3.200a1.200 1.200 0 1 1 0 2.400 1.200 1.200 0 0 1 0-2.400Z"/>',
  fb: '<path d="M13.500 22v-8h2.700l.400-3.200h-3.100V8.700c0-.900.300-1.500 1.600-1.500h1.700V4.300c-.300 0-1.300-.100-2.500-.100-2.400 0-4.100 1.500-4.100 4.200v2.400H7.500V14h2.700v8h3.300Z"/>'
};

/* --- botones --- */
const LINKS = [
  { cls: "principal", ic: "wa", t: "Pedir por WhatsApp", s: "Escríbenos y te lo apartamos", href: wa("Hola, quiero hacer un pedido."), falta: "número de WhatsApp" },
  { ic: "cat", t: "Ver qué tenemos", s: "Productos, guisos y botanas", href: "#encuentras", interno: true },
  { ic: "star", t: "Califícanos en Google", s: "Tu reseña nos ayuda un montón", href: CONFIG.resenaUrl, falta: "ficha de Google" },
  { ic: "pin", t: "Cómo llegar", s: "Abrir en Google Maps", href: CONFIG.mapsUrl, falta: "link de Maps" },
  { ic: "ig", t: "Instagram", s: "Síguenos", href: CONFIG.instagram, opcional: true },
  { ic: "tel", t: "Llamar a la tienda", s: tel ? fmtTel(tel) : "Marca directo", href: tel ? `tel:+52${tel}` : "", falta: "teléfono" }
];
const faltan = new Set();
for (const l of LINKS) {
  const cuerpo = `<span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[l.ic]}</svg></span><span><b>${l.t}</b><span>${l.s}</span></span>`;
  if (l.href) {
    $("links").append(el("a", l.interno ? { class: "btn", href: l.href } : { class: "btn " + (l.cls || ""), href: l.href, target: "_blank", rel: "noopener" }, cuerpo + (l.interno ? '<span class="fl" aria-hidden="true">↓</span>' : '<span class="fl" aria-hidden="true">→</span>')));
  } else if (CONFIG.borrador && !l.opcional) {
    faltan.add(l.falta);
    $("links").append(el("div", { class: "btn falta " + (l.cls || "") }, cuerpo + `<span class="tag">Falta</span>`));
  }
}

/* --- pasillos --- */
for (const p of CONFIG.pasillos) $("pasillos").append(el("li", {}, esc(p)));

/* --- horario y datos --- */
const DIAS = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const ahoraGDL = () => new Date(new Date().toLocaleString("en-US", { timeZone: "America/Mexico_City" }));
const h12 = t => { let [h, m] = t.split(":").map(Number); const s = h >= 12 ? "pm" : "am"; h = h % 12 || 12; return m ? `${h}:${String(m).padStart(2,"0")} ${s}` : `${h} ${s}`; };
const hayHorario = CONFIG.horario.length === 7;
const fila = (dt, dd) => $("datos").append(el("div", {}, `<dt>${dt}</dt><dd>${dd}</dd>`));

if (hayHorario) {
  const n = ahoraGDL(), hoy = n.getDay(), min = n.getHours() * 60 + n.getMinutes();
  const r = CONFIG.horario[hoy], aMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
  const abierto = r && min >= aMin(r[0]) && min < aMin(r[1]);
  const e = $("estado"); e.hidden = false; e.classList.toggle("cerrado", !abierto);
  e.lastElementChild.textContent = abierto ? `Abierto · cierra ${h12(r[1])}` : (r && min < aMin(r[0]) ? `Cerrado · abre ${h12(r[0])}` : "Cerrado ahorita");
  const orden = [1,2,3,4,5,6,0];
  fila("Horario", '<div class="horas">' + orden.map(d => { const x = CONFIG.horario[d], c = d === hoy ? ' class="hoy"' : ""; return `<span${c}>${DIAS[d]}</span><span${c}>${x ? h12(x[0]) + " a " + h12(x[1]) : "Cerrado"}</span>`; }).join("") + "</div>");
} else if (CONFIG.borrador) { faltan.add("horario"); fila("Horario", '<span class="pend">Por confirmar</span>'); }

if (CONFIG.direccion) fila("Dirección", esc(CONFIG.direccion));
else if (CONFIG.borrador) { faltan.add("dirección"); fila("Dirección", '<span class="pend">Valle Imperial, Zapopan. Falta calle y número.</span>'); }
if (CONFIG.pagos.length) fila("Pagos", esc(CONFIG.pagos.join(" · ")));
if (CONFIG.domicilio === true) fila("Entrega", "A domicilio en Valle Imperial o pasas por tu pedido");
else if (CONFIG.domicilio === false) fila("Entrega", "Pide por WhatsApp y pasa por tu pedido");
else if (CONFIG.borrador) faltan.add("si entregan a domicilio");
if (tel) fila("Teléfono", `<span style="user-select:all">${fmtTel(tel)}</span>`);

if (CONFIG.borrador) { $("borrador").hidden = false; $("faltantes").textContent = faltan.size ? "Falta: " + [...faltan].join(", ") + "." : "Ya están todos los datos, cambia borrador a false."; }

/* --- lista del mandado --- */
const KEY = "sanluis-lista";
let lista = [];
try { lista = JSON.parse(localStorage.getItem(KEY) || "[]").filter(i => i && i.n && i.q > 0); } catch (e) {}
const guardar = () => { try { localStorage.setItem(KEY, JSON.stringify(lista)); } catch (e) {} };
const buscar = n => lista.find(i => i.n.toLowerCase() === n.toLowerCase());
const mensaje = () => "Hola, quiero pedir:\n" + lista.map(i => (i.q === 1 && /^\d/.test(i.n)) ? `• ${i.n}` : `• ${i.q} ${i.n}`).join("\n") + (CONFIG.domicilio === true ? "\n\n¿Me lo pueden traer a domicilio?" : "\n\nPaso por él, gracias.");

function pintar() {
  $("ticket").innerHTML = "";
  lista.forEach((i, k) => {
    const li = el("li", {}, `<span>${esc(i.n)}</span><span class="cant"><button type="button" data-k="${k}" data-d="-1" aria-label="Quitar uno de ${esc(i.n)}">−</button><output>${i.q}</output><button type="button" data-k="${k}" data-d="1" aria-label="Agregar uno de ${esc(i.n)}">+</button></span>`);
    $("ticket").append(li);
  });
  $("vacia").hidden = lista.length > 0;
  $("enviar").disabled = lista.length === 0;
  for (const c of $("rapidos").children) c.setAttribute("aria-pressed", buscar(c.textContent) ? "true" : "false");
  if (!$("previa").hidden) $("previa").hidden = true;
  guardar();
}
function agregar(n) { n = n.trim(); if (!n) return; const i = buscar(n); i ? i.q++ : lista.push({ n, q: 1 }); pintar(); }

for (const r of CONFIG.rapidos) $("rapidos").append(el("button", { type: "button", class: "chip", "aria-pressed": "false" }, esc(r)));
$("rapidos").addEventListener("click", e => { const c = e.target.closest(".chip"); if (!c) return; const i = buscar(c.textContent); if (i) lista = lista.filter(x => x !== i); else lista.push({ n: c.textContent, q: 1 }); pintar(); });
$("agrega").addEventListener("submit", e => { e.preventDefault(); agregar($("nuevo").value); $("nuevo").value = ""; });
$("ticket").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; const i = lista[+b.dataset.k]; i.q += +b.dataset.d; if (i.q < 1) lista.splice(+b.dataset.k, 1); pintar(); });
$("enviar").addEventListener("click", () => {
  if (CONFIG.whatsapp) { window.location.href = wa(mensaje()); return; }
  $("previa").hidden = false; $("previa").innerHTML = "<b>Así le llega al WhatsApp de la tienda</b>" + esc(mensaje());
});
$("icwa").innerHTML = IC.wa;
pintar();
</script>
</body>
</html>
